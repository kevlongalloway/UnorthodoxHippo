<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#161D2E" />
    <meta name="description" content="A literary social platform for readers who write." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Précis" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Précis</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html { height: 100%; overflow: hidden; }
      body {
        margin: 0; padding: 0; height: 100%;
        background: #161D2E; color: #E8E2D6;
        /* Prevent pull-to-refresh and scroll bounce */
        overscroll-behavior: none;
        /* Remove tap flash on mobile */
        -webkit-tap-highlight-color: transparent;
        /* Smooth font rendering */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        /* Prevent horizontal overflow */
        overflow-x: hidden;
      }
      #root {
        margin: 0; padding: 0;
        height: 100%;
        /* Scroll happens inside pages, not on body */
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-y: none;
      }
      /* Fast taps — removes 300ms delay */
      button, a, [role="button"] { touch-action: manipulation; }
      /* Prevent text selection on interactive UI chrome */
      button { user-select: none; -webkit-user-select: none; }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
